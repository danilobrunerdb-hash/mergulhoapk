name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Executar testes automatizados
        run: npm test

      - name: Gerar build web e sincronizar Capacitor
        run: npm run build:android

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tabela-Mergulho-CBMMG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK à Release (caso seja uma tag de versão)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
